seed_list: [42, 0, 1, 2, 3, 7, 11, 13, 17, 23]

data:
  graphs_dir: data/processed
  preset: seq_ss_alt
  max_len: 161

model:
  arch: rgcn
  in_dim: 640
  hidden: 128
  num_layers: 2
  dropout: 0.4
  norm: graph
  residual: true
  num_bases: null

loss:
  name: tcl_focal
  pos_weight_floor: 3.0
  focal_alpha: null

train:
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-4
  epochs: 120
  batch_size: 8
  scheduler: cosine_warm_restarts
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-6
  early_stop_patience: 15
  early_stop_metric: mcc
  grad_clip: 5.0
  drop_edge_p: 0.1
  device: auto

eval:
  threshold_search: true
  threshold_metric: mcc

paths:
  checkpoints: checkpoints/controlled
  results: results/controlled
  logs: logs
